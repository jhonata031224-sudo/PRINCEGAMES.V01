<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince Games — Pilih Role</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #070d14;
      --card:   #0d1520;
      --border: rgba(255,255,255,.08);
      --cyan:   #00d9ff;
      --purple: #b026ff;
      --text:   #edf4ff;
      --muted:  #7f93aa;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Glow dekoratif */
    body::before {
      content: '';
      position: fixed;
      top: -120px; left: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,217,255,.18) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -120px; right: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(176,38,255,.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
      text-align: center;
    }

    /* Logo */
    .logo {
      margin-bottom: 10px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(0,217,255,.15), rgba(176,38,255,.15));
      border: 1px solid rgba(0,217,255,.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 0 24px rgba(0,217,255,.15);
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo h1 span {
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      color: var(--muted);
      font-size: 13.5px;
      margin-top: 6px;
    }

    /* Card pilih role */
    .card {
      background: rgba(13,21,32,.85);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px 28px;
      margin-top: 28px;
      backdrop-filter: blur(12px);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* Role buttons */
    .role-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s ease;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .role-btn:last-child { margin-bottom: 0; }

    .role-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s;
    }
    .role-btn:hover::before { opacity: 1; }
    .role-btn:active { transform: scale(.98); }

    /* Pelanggan — cyan */
    .role-btn.pelanggan {
      border-color: rgba(0,217,255,.25);
    }
    .role-btn.pelanggan::before {
      background: linear-gradient(135deg, rgba(0,217,255,.08), transparent);
    }
    .role-btn.pelanggan:hover {
      border-color: rgba(0,217,255,.5);
      box-shadow: 0 0 20px rgba(0,217,255,.12);
    }
    .role-btn.pelanggan .icon {
      background: rgba(0,217,255,.12);
      color: var(--cyan);
    }
    .role-btn.pelanggan .arrow { color: var(--cyan); }

    /* Staff — purple */
    .role-btn.staff {
      border-color: rgba(176,38,255,.25);
    }
    .role-btn.staff::before {
      background: linear-gradient(135deg, rgba(176,38,255,.08), transparent);
    }
    .role-btn.staff:hover {
      border-color: rgba(176,38,255,.5);
      box-shadow: 0 0 20px rgba(176,38,255,.12);
    }
    .role-btn.staff .icon {
      background: rgba(176,38,255,.12);
      color: var(--purple);
    }
    .role-btn.staff .arrow { color: var(--purple); }

    /* Owner — gold */
    .role-btn.owner {
      border-color: rgba(255,185,0,.2);
    }
    .role-btn.owner::before {
      background: linear-gradient(135deg, rgba(255,185,0,.07), transparent);
    }
    .role-btn.owner:hover {
      border-color: rgba(255,185,0,.4);
      box-shadow: 0 0 20px rgba(255,185,0,.1);
    }
    .role-btn.owner .icon {
      background: rgba(255,185,0,.1);
      color: #ffb900;
    }
    .role-btn.owner .arrow { color: #ffb900; }

    .icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .role-info {
      flex: 1;
      text-align: left;
    }
    .role-info .role-name { font-size: 15px; font-weight: 700; }
    .role-info .role-desc { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; }

    .arrow {
      font-size: 14px;
      opacity: .7;
      transition: transform .2s;
    }
    .role-btn:hover .arrow { transform: translateX(4px); opacity: 1; }

    /* Footer */
    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
    }
    .footer span {
      color: var(--cyan);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="logo">
      <div class="logo-icon">🎮</div>
      <h1><span>Prince Games</span></h1>
      <p>Sistem Manajemen Rental PS</p>
    </div>

    <div class="card">
      <div class="card-title">Masuk sebagai</div>

      <a href="login-pelanggan.html" class="role-btn pelanggan">
        <div class="icon"><i class="fas fa-user"></i></div>
        <div class="role-info">
          <div class="role-name">Pelanggan</div>
          <div class="role-desc">Booking & cek status rental</div>
        </div>
        <i class="fas fa-chevron-right arrow"></i>
      </a>

      <a href="login-staff.html" class="role-btn staff">
        <div class="icon"><i class="fas fa-headset"></i></div>
        <div class="role-info">
          <div class="role-name">Staff</div>
          <div class="role-desc">Kelola sesi & transaksi harian</div>
        </div>
        <i class="fas fa-chevron-right arrow"></i>
      </a>

      <a href="login-owner.html" class="role-btn owner">
        <div class="icon"><i class="fas fa-crown"></i></div>
        <div class="role-info">
          <div class="role-name">Owner</div>
          <div class="role-desc">Dashboard & laporan bisnis</div>
        </div>
        <i class="fas fa-chevron-right arrow"></i>
      </a>
    </div>

    <div class="footer">
      &copy; 2025 <span>Prince Games</span> — All rights reserved
    </div>

  </div>
</body>
</html>
